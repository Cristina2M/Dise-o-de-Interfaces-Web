<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demostración de Cursos CSS</title>
    <link rel="stylesheet" href="ejer5.css"> </head>
<body>

    <h1>Pasa el Ratón (Hover) sobre las Cajas para Ver el Cursor</h1>
    <div class="contenedor-cursores">
        <div class="caja pointer">pointer</div>
        <div class="caja help">help</div>
        <div class="caja wait">wait</div>
        <div class="caja progress">progress</div>
        <div class="caja text">text</div>
        <div class="caja move">move</div>
        <div class="caja crosshair">crosshair</div>
        <div class="caja not-allowed">not-allowed</div>
        <div class="caja ns-resize">ns-resize</div>
        <div class="caja grab">grab</div>
    </div>

</body>
</html>
