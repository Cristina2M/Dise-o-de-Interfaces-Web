<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel de videos</title>

    <!-- CSS de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Fuente Raleway desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>
<body>
    





<!-- para que se muevan de forma automatica poner:  data-bs-interval=6000 -->


<div class="container mt-5" style="width: 1000px;"> 
  
  <div id="carouselExampleCaptions" class="carousel slide shadow-lg overflow-hidden rounded-3">
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>

    <div class="carousel-inner" data-bs-interval="6000">
      <div class="carousel-item active">
        <video src="https://mdbcdn.b-cdn.net/img/video/Tropical.mp4" class="d-block w-100" autoplay muted loop></video>
        <div class="carousel-caption d-none d-md-block">
          <h5>Primer vídeo</h5>
          <p>Descripción del primer video</p>
        </div>
      </div>

      <div class="carousel-item" data-bs-interval="6000">
        <video src="https://mdbcdn.b-cdn.net/img/video/forest.mp4" class="d-block w-100" autoplay muted loop></video>
        <div class="carousel-caption d-none d-md-block">
          <h5>Segundo vídeo</h5>
          <p>Descripción del segundo video</p>
        </div>
      </div>

      <div class="carousel-item" data-bs-interval="6000">
        <video src="https://mdbcdn.b-cdn.net/img/video/Agua-natural.mp4" class="d-block w-100" autoplay muted loop></video>
        <div class="carousel-caption d-none d-md-block">
          <h5>Tercer vídeo</h5>
          <p>Descripción del tercer video</p>
        </div>
      </div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

</div>



    





</body>
</html>
