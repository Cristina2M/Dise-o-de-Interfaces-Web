<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>

    <!-- Contenedor superior -->
    <div class="container shadow rounded p-3 mt-3 m-auto">
        <div class="row align-items-center justify-content-between">
            <div class="text-center col-2">
                <img src="https://picsum.photos/150" alt="Imagen Perfil" class="img-fluid rounded-circle shadow">
            </div>
            <div class="texto col-6">
                <h2 class="fw-bold">Cristina Moreno</h2>
                <p class="text-secondary mb-1">Alumna de Desarrollo Web</p>
                <p>Especialista en sistemas, redes, programación y desarrollo de IAs para ciclos formativos</p>
            </div>
            <div class="botones col-3">
                <button class="btn btn-primary w-100 mb-2"><i class="bi bi-envelope"></i>Contactar</button>
                <button class="btn btn-light btn-outline-dark w-100"><i class="bi bi-info-circle"></i>Ver Más</button>
            </div>
        </div>
    </div>


    <!-- Galeria de imagenes -->
    <div class="container mt-5 m-auto">
        <div class="row justify-content-around">
            <div class="col-4 shadow rounded">
                <img src="https://picsum.photos/400/300?1" alt="img1" class="img-fluid rounded w-90 mt-2 align-self-center">
                <p class="text-secondary text-center">Imagen 1</p>
            </div>
            <div class="col-4 shadow rounded">
                <img src="https://picsum.photos/400/300?2" alt="img2" class="img-fluid rounded w-90 mt-2 align-self-center">
                <p class="text-secondary text-center">Imagen 2</p>
            </div>
            <div class="col-4 shadow rounded">
                <img src="https://picsum.photos/400/300?3" alt="img3" class="img-fluid rounded w-90 mt-2 align-self-center">
                <p class="text-secondary text-center">Imagen 3</p>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
