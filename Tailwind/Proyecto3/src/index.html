<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>PRJ-Tailwind-1</title>
</head>

<body class="bg-gray-600 flex items-center justify-center min-h-screen">
    <div class="bg-gray-800 text-white flex flex-col md:flex-row max-w-4xl mx-4 rounded-3xl overflow-hidden p-3 items-center">
        <div class="h-full">
            <img src="../asset/image.jpg" alt="imagen" class="rounded-2xl h-80 w-full object-cover hover:scale-110 transition">
        </div>

        <div class="text-gray-300 px-3">
            <p class="text-2xl font-serif mb-4">Recibe consejos de dieta y fitness en tu bandeja de entrada</p>

            <p class="text-gray-400 mb-5">Come mejor y haz ejercicio mejor. Suscríbee al boletín Diet&Fitness</p>

            <form action="" class="">
                <input type="text" class="border border-gray-400 p-2 mr-3" placeholder="Inserta tu email">
                <button class="bg-green-700 text-gray-800 py-2 px-4 rounded-md hover:text-white hover:bg-green-800 transition">Subscríbete</button>
            </form>
        </div>

    </div>
</body>

</html>
