<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout- Galería</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="galeria-contenedor">
        <h2 class="galeria-titulo">Galería con Grid (imágenes regulares)</h2>
        
        <div class="galeria-grid">
            <img src="img/1.jpg" alt="Portátil con luces de colores" class="galeria-item">
            <img src="img/2.jpg" alt="Portátil y accesorios sobre una mesa" class="galeria-item">
            <img src="img/3.jpg" alt="Rollos de fotografia" class="galeria-item">
            <img src="img/4.jpg" alt="Botella de Coca-Cola" class="galeria-item">
            <img src="img/5.jpg" alt="Teléfono, reloj y Auriculares" class="galeria-item">
            <img src="img/6.jpg" alt="Zapatilla roja" class="galeria-item">
            <img src="img/7.jpg" alt="Auriculares inalámbricos" class="galeria-item">
            <img src="img/8.jpg" alt="Mano sosteniendo un teléfono de Apple" class="galeria-item">
        </div>
    </div>


    <div class="galeria-contenedor">
        <h2 class="galeria-titulo galeria-titulo-irregular">Galería con Grid (imágenes irregulares)</h2>
        
        <div class="galeria-grid-areas"> <img src="img/1.jpg" alt="Laptop con iluminación de colores" class="area-img-1">
            <img src="img/2.jpg" alt="Laptop y accesorios sobre una mesa" class="area-img-2">
            <img src="img/3.jpg" alt="Rollos de película fotográfica" class="area-img-3">
            
            <img src="img/4.jpg" alt="Botella de Coca-Cola en fondo rojo" class="area-img-4">
            <img src="img/5.jpg" alt="Accesorios rojos: teléfono, reloj y audífonos" class="area-img-5">
            <img src="img/6.jpg" alt="Zapatilla deportiva roja" class="area-img-6">
            <img src="img/7.jpg" alt="Audífonos inalámbricos flotando sobre una mano" class="area-img-7">
            
            <img src="img/8.jpg" alt="Mano sosteniendo un teléfono con logo de Apple" class="area-img-8">
        </div>
    </div>
</body>
</html>
